[project]
name = "certified-workflow-conversion"
version = "0.1.0b1"
description = "Evidence-bound workflow throughput diagnostics and certified lower-bound reports for AI agent pipelines."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "K. Takahashi" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = [
  "ai-agents",
  "workflow",
  "workflow-optimization",
  "certified-throughput",
  "certified-workflow",
  "workflow-verification",
  "bottleneck-analysis",
  "evidence-ledger",
  "evidence-contracts",
  "ai-workflows",
  "ports-and-adapters",
  "no-meta",
  "observable-only",
]
dependencies = [
  "jsonschema>=4.22.0",
  "orjson>=3.10.0",
  "pydantic>=2.7.0",
  "rich>=13.7.0",
  "typer>=0.12.0",
]

[project.optional-dependencies]
yaml = ["pyyaml>=6.0.0"]
oawm = []
full = [
  "numpy>=1.26.0",
  "scipy>=1.11.0",
]
dev = [
  "mypy>=1.10.0",
  "pytest>=8.2.0",
  "ruff>=0.5.0",
  "types-jsonschema>=4.23.0.20241208",
]

[project.scripts]
cwc = "certified_workflow_conversion.cli.app:main"

[project.entry-points."cwc.storage_backends"]
sqlite = "certified_workflow_conversion.adapters.sqlite_store:create_store"
memory = "certified_workflow_conversion.adapters.in_memory_store:create_store"

[project.entry-points."cwc.analyzers"]
deterministic = "certified_workflow_conversion.adapters.deterministic_analyzer:create_analyzer"
full = "certified_workflow_conversion.adapters.full_certification:FullCertificationAnalyzer"

[project.entry-points."cwc.optimizers"]
deterministic = "certified_workflow_conversion.adapters.deterministic_analyzer:create_optimizer"

[project.entry-points."cwc.oawm_bridges"]
sqlite = "certified_workflow_conversion.adapters.oawm_bridge:create_bridge"

[project.entry-points."cwc.report_sinks"]
json = "certified_workflow_conversion.adapters.report_sinks:create_json_sink"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["certified_workflow_conversion"]
